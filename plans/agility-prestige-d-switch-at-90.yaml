name: agility prestige D - XP I+II to 90, then respec to XP I + Endurance I
seed: 42

# B wins early, C wins late: the XP bonus pays off while sessions are cheap and
# levels come fast, while Endurance only pays once the duration floor is doing
# real work near 99. This plan tries to take both halves, respeccing at 90.
#
# The game supports this: respecPrestige wipes a skill's nodes and refunds the
# points, on a 24h per-skill cooldown. One switch does not run into that.
loadout:
  pets: [graceling_sprite]
  capes: [agility_cape]
  blessing: divine_grace
  prestige:
    agility:
      - agility_xp_1        # +5%  (cost 1)
      - agility_xp_2        # +10% (cost 1)

steps:
  - skill: agility
    course: best
    untilLevel: 90
    note: XP Boost I+II to 90

  - skill: agility
    course: best
    untilLevel: 99
    note: respec at 90, Endurance to 99
    prestige:
      agility:
        - agility_xp_1        # +5% xp         (cost 1)
        - agility_endurance_1 # -3.5 min floor (cost 2)
