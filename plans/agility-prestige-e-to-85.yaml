name: agility prestige E - XP I + Endurance I, stop at 85
seed: 42

# Plan C's allocation, stopped at the level where Endurance I brings sessions
# back to 40 minutes -- the length they are at 99 with no prestige at all.
#
# That makes this the "underwater" stretch: from prestiging until level 85 every
# session in every skill is longer than it was before prestiging, because
# session duration keys off agility level. Past 85 the character is ahead of
# where it started, ending at 36:30 sessions at 99.
loadout:
  pets: [graceling_sprite]
  capes: [agility_cape]
  tools:                    # all six standard hooks; best usable is equipped per course
    - bronze_grappling_hook       # req  1, 1.00x
    - iron_grappling_hook         # req 15, 1.25x
    - steel_grappling_hook        # req 30, 1.50x
    - mithril_grappling_hook      # req 55, 1.75x
    - adamantite_grappling_hook   # req 70, 2.00x
    - runite_grappling_hook       # req 85, 2.25x
  blessing: divine_grace
  prestige:
    agility:
      - agility_xp_1          # +5% xp             (cost 1)
      - agility_endurance_1   # -3.5 min floor     (cost 2)

steps:
  - skill: agility
    course: best
    untilLevel: 85
