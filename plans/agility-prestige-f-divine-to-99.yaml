name: agility prestige F - C, but stay on divine past 90
seed: 42

# Plan C's allocation, refusing the transcendent course at 90.
#
# Tool efficiency is +25% per tier the hook outranks the COURSE, so a harder
# course can be worth less. Transcendent (req 90) sits in the same tier as a
# runite hook and earns no bonus, dropping to 4 laps/min, while divine (req 80)
# keeps 6:
#
#   divine        6 laps/min x  790 xp = 4740 xp/min
#   transcendent  4 laps/min x 1000 xp = 4000 xp/min
#
# Success rate widens it further. It is 0.80 + 0.02 per level above the course
# requirement, capped at 0.95: divine is capped from level 87 on, while
# transcendent starts at 80% at level 90 and only reaches the cap at 98.
loadout:
  pets: [graceling_sprite]
  capes: [agility_cape]
  tools:                    # all six standard hooks; best usable is equipped per course
    - bronze_grappling_hook       # req  1, 1.00x
    - iron_grappling_hook         # req 15, 1.25x
    - steel_grappling_hook        # req 30, 1.50x
    - mithril_grappling_hook      # req 55, 1.75x
    - adamantite_grappling_hook   # req 70, 2.00x
    - runite_grappling_hook       # req 85, 2.25x
  blessing: divine_grace
  prestige:
    agility:
      - agility_xp_1          # +5% xp             (cost 1)
      - agility_endurance_1   # -3.5 min floor     (cost 2)

steps:
  - skill: agility
    course: best
    untilLevel: 90
    note: best course to 90

  - skill: agility
    course: divine_course
    untilLevel: 99
    note: stay on divine to 99
