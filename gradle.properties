# Gradle 8.7 (matching the game submodule) does not run on JDK 26, this machine's
# default. Kotlin 2.0.0's Gradle plugin in turn does not support Gradle 9.x, so the
# way out is to run Gradle itself on 21 rather than to bump either version.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
